[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-idle-compact"
version = "0.2.0"
description = "Automatic native idle compaction for daemon-backed Codex sessions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["websockets>=14,<16"]

[project.scripts]
codex-idle-compact = "codex_idle_compact:main"

[project.urls]
Repository = "https://github.com/Winfred666/codex-idle-compact"

[tool.setuptools]
py-modules = ["codex_idle_compact", "idle_plugin"]
